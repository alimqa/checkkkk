<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Тест цветовых энергий</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F5F2;
  --card: #FFFFFF;
  --text: #1A1A1A;
  --muted: #6B6B6B;
  --border: rgba(0,0,0,0.09);
  --r: 14px;
  --rs: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }
body {
  font-family: 'Manrope', sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 20px 16px 40px;
  display: flex;
  justify-content: center;
}
.container { width: 100%; max-width: 600px; }
.logo {
  font-family: 'Unbounded', sans-serif;
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.1em; color: var(--muted);
  text-align: center; margin-bottom: 24px;
  text-transform: uppercase;
}
.card {
  background: var(--card);
  border-radius: var(--r);
  border: 1px solid var(--border);
  padding: 32px 28px;
  box-shadow: 0 2px 20px rgba(0,0,0,0.04);
}
@media(max-width:480px){ .card { padding: 24px 18px; } }
.screen { display: none; }
.screen.active { display: block; }

.quad {
  width: 64px; height: 64px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 3px;
  border-radius: 16px; overflow: hidden;
  margin: 0 auto 24px;
}
.quad span { display: block; }
h1 {
  font-family: 'Unbounded', sans-serif;
  font-size: 20px; font-weight: 600;
  text-align: center; line-height: 1.3;
  margin-bottom: 12px;
}
.sub { font-size: 14px; color: var(--muted); line-height: 1.7; text-align: center; margin-bottom: 28px; }
.meta { display: flex; justify-content: center; gap: 28px; margin-bottom: 28px; }
.meta-item { text-align: center; font-size: 13px; color: var(--muted); }
.meta-item strong {
  display: block;
  font-family: 'Unbounded', sans-serif;
  font-size: 22px; font-weight: 600;
  color: var(--text); margin-bottom: 2px;
}
input[type=text] {
  width: 100%; padding: 14px 16px;
  font-size: 15px; font-family: 'Manrope', sans-serif;
  border: 1.5px solid var(--border); border-radius: var(--rs);
  background: var(--bg); color: var(--text);
  margin-bottom: 14px; outline: none;
  transition: border-color .2s;
}
input[type=text]:focus { border-color: var(--text); }

.btn {
  display: block; width: 100%; padding: 16px;
  font-size: 15px; font-weight: 600; font-family: 'Manrope', sans-serif;
  background: var(--text); color: #fff;
  border: none; border-radius: var(--rs);
  cursor: pointer;
  touch-action: manipulation;
  -webkit-touch-callout: none;
  user-select: none;
  transition: opacity .15s;
}
.btn:active { opacity: 0.7; }
.btn.sec {
  background: transparent; color: var(--text);
  border: 1.5px solid var(--border); font-weight: 500;
}
.btn.sec:active { background: var(--bg); opacity: 1; }
.btn:disabled { opacity: 0.3; pointer-events: none; }

.prog-wrap { margin-bottom: 24px; }
.prog-info { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.prog-track { height: 3px; background: rgba(0,0,0,0.08); border-radius: 3px; }
.prog-fill { height: 3px; background: var(--text); border-radius: 3px; transition: width .4s ease; width: 0; }

.q-hint { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }

.opts { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
.opt {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 18px;
  border: 1.5px solid var(--border); border-radius: var(--rs);
  cursor: pointer;
  touch-action: manipulation;
  -webkit-touch-callout: none;
  user-select: none;
  font-size: 15px; line-height: 1.5;
  color: var(--text); background: var(--card);
  transition: border-color .15s, background .15s;
}
.opt.sel { border-color: var(--text); background: var(--bg); }
.opt-l {
  width: 30px; height: 30px; flex-shrink: 0;
  border-radius: 8px; background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: var(--muted);
  transition: background .15s, color .15s;
}
.opt.sel .opt-l { background: var(--text); color: #fff; }

.nav { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }

.badge {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 16px; border-radius: 99px;
  font-size: 13px; font-weight: 600; margin-bottom: 16px;
}
.res-name { font-family: 'Unbounded', sans-serif; font-size: 22px; font-weight: 600; line-height: 1.3; margin-bottom: 10px; }
.res-desc { font-size: 14px; color: var(--muted); line-height: 1.7; margin-bottom: 24px; }

.bars { margin-bottom: 24px; }
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.bar-name { font-size: 13px; font-weight: 600; width: 88px; flex-shrink: 0; }
.bar-track { flex: 1; height: 6px; background: rgba(0,0,0,0.07); border-radius: 6px; overflow: hidden; }
.bar-fill { height: 6px; border-radius: 6px; width: 0; transition: width 1s cubic-bezier(.4,0,.2,1); }
.bar-pct { font-size: 13px; font-weight: 600; color: var(--muted); width: 34px; text-align: right; flex-shrink: 0; }

.ibox { background: var(--bg); border-radius: var(--rs); padding: 16px; margin-bottom: 12px; }
.ibox-lbl { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.ibox p { font-size: 14px; line-height: 1.6; }
.igrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
@media(max-width:420px){ .igrid { grid-template-columns: 1fr; } }

.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 99px; }
.divider { height: 1px; background: var(--border); margin: 20px 0; }
.sec-title { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.sec-desc { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 20px; }
</style>
</head>
<body>
<div class="container">
  <div class="logo">Insights Discovery · Цветовые энергии</div>
  <div class="card">
    <div class="screen active" id="s-intro">
      <div class="quad">
        <span style="background:#E63946"></span>
        <span style="background:#F4A422"></span>
        <span style="background:#2D9B6F"></span>
        <span style="background:#2B7FD4"></span>
      </div>
      <h1>Какая энергия вами движет?</h1>
      <p class="sub">Определите ваш ведущий стиль взаимодействия. Нет правильных ответов — только ваша естественная реакция.</p>
      <div class="meta">
        <div class="meta-item"><strong>20</strong>вопросов</div>
        <div class="meta-item"><strong>5</strong>минут</div>
        <div class="meta-item"><strong>4</strong>энергии</div>
      </div>
      <input type="text" id="uname" placeholder="Ваше имя (необязательно)">
      <button class="btn" id="btn-start">Начать тест</button>
    </div>

    <div class="screen" id="s-test">
      <div class="prog-wrap">
        <div class="prog-info">
          <span id="q-num">Вопрос 1 из 20</span>
          <span id="q-pct">0%</span>
        </div>
        <div class="prog-track"><div class="prog-fill" id="prog"></div></div>
      </div>
      <div class="q-hint">Выберите, что вам ближе</div>
      <div class="opts" id="opts"></div>
      <div class="nav">
        <button class="btn sec" id="btn-back">← Назад</button>
        <button class="btn" id="btn-next">Далее →</button>
      </div>
    </div>

    <div class="screen" id="s-result">
      <div id="res"></div>
      <button class="btn sec" id="btn-reset" style="margin-top:10px">Пройти ещё раз</button>
    </div>
  </div>
</div>

<script>
var qs=[
  {a:{t:"Я действую быстро и решительно",c:"R"},b:{t:"Я сначала обдумываю, потом действую",c:"B"}},
  {a:{t:"Мне нравится быть в центре внимания",c:"Y"},b:{t:"Я предпочитаю работать в тишине",c:"G"}},
  {a:{t:"Меня раздражает медлительность других",c:"R"},b:{t:"Я терпелив и готов выслушать",c:"G"}},
  {a:{t:"Я руководствуюсь логикой и фактами",c:"B"},b:{t:"Я руководствуюсь интуицией и чувствами",c:"Y"}},
  {a:{t:"Для меня важен результат, а не процесс",c:"R"},b:{t:"Для меня важны отношения в команде",c:"G"}},
  {a:{t:"Я люблю мозговые штурмы и новые идеи",c:"Y"},b:{t:"Я предпочитаю чёткий план и структуру",c:"B"}},
  {a:{t:"Я говорю прямо, даже если это неудобно",c:"R"},b:{t:"Я стараюсь сохранить гармонию в команде",c:"G"}},
  {a:{t:"Я оптимистичен и заряжаю других энергией",c:"Y"},b:{t:"Я точен и внимателен к деталям",c:"B"}},
  {a:{t:"Мне важно контролировать ситуацию",c:"R"},b:{t:"Мне важно, чтобы всем было комфортно",c:"G"}},
  {a:{t:"Я легко завожу новые знакомства",c:"Y"},b:{t:"Я предпочитаю глубокое общение с несколькими людьми",c:"B"}},
  {a:{t:"Я принимаю решения быстро",c:"R"},b:{t:"Я тщательно анализирую перед решением",c:"B"}},
  {a:{t:"Я вдохновляю других своим энтузиазмом",c:"Y"},b:{t:"Я поддерживаю других своей надёжностью",c:"G"}},
  {a:{t:"Мне важно побеждать и достигать целей",c:"R"},b:{t:"Мне важно делать работу правильно и качественно",c:"B"}},
  {a:{t:"Я люблю перемены и новые вызовы",c:"Y"},b:{t:"Я ценю стабильность и предсказуемость",c:"G"}},
  {a:{t:"Я напорист и умею убеждать",c:"R"},b:{t:"Я дипломатичен и умею слушать",c:"G"}},
  {a:{t:"Я генерирую идеи быстро и легко",c:"Y"},b:{t:"Я проверяю идеи на ошибки и противоречия",c:"B"}},
  {a:{t:"Я берусь за несколько задач одновременно",c:"Y"},b:{t:"Я доделываю одно дело до конца, потом берусь за другое",c:"B"}},
  {a:{t:"Мне комфортно руководить и принимать решения",c:"R"},b:{t:"Мне комфортно поддерживать и помогать другим",c:"G"}},
  {a:{t:"Я легко выражаю эмоции",c:"Y"},b:{t:"Я сдержан и редко показываю эмоции",c:"B"}},
  {a:{t:"Я верю: важнее всего результат",c:"R"},b:{t:"Я верю: важнее всего доверие в команде",c:"G"}}
];

var clrs={
  R:{name:"Огненно-красный",em:"🔴",hex:"#E63946",light:"#FFF0F1",dark:"#8B1A22",
     desc:"Энергичны, решительны, ориентированы на результат. Вы двигаете дело вперёд и не боитесь вызовов.",
     str:["Лидерство","Решительность","Результативность","Напористость"],
     ch:"Иногда кажетесь нетерпеливым или слишком прямолинейным для окружающих.",
     tip:"Учитывайте темп других — немного терпения усилит вашу команду.",
     sec:"Дополнительный акцент на достижение целей и прямолинейное взаимодействие."},
  Y:{name:"Солнечно-жёлтый",em:"🟡",hex:"#F4A422",light:"#FFFBF0",dark:"#7A4F00",
     desc:"Энтузиасты и вдохновители. Вы заряжаете команду энергией и легко генерируете свежие идеи.",
     str:["Энтузиазм","Коммуникабельность","Креативность","Оптимизм"],
     ch:"Иногда сложно довести начатое до конца или сфокусироваться на деталях.",
     tip:"Добавьте структуры в свои идеи — тогда они точно воплотятся в жизнь.",
     sec:"Гибкость, умение вдохновлять и видеть возможности там, где другие не замечают."},
  G:{name:"Земляной зелёный",em:"🟢",hex:"#2D9B6F",light:"#F0FAF5",dark:"#145C3F",
     desc:"Надёжная опора команды. Вы терпеливы, заботливы и создаёте атмосферу доверия вокруг себя.",
     str:["Терпение","Командность","Надёжность","Эмпатия"],
     ch:"Иногда трудно отказывать или открыто выражать несогласие.",
     tip:"Ваш голос важен — не бойтесь высказывать своё мнение прямо.",
     sec:"Ориентация на отношения, стабильность и командное благополучие."},
  B:{name:"Холодно-синий",em:"🔵",hex:"#2B7FD4",light:"#F0F7FF",dark:"#0D3D6E",
     desc:"Аналитики и перфекционисты. Вы думаете системно, внимательны к деталям и делаете работу качественно.",
     str:["Аналитичность","Точность","Системность","Качество"],
     ch:"Иногда сложно принять решение без полной проверенной информации.",
     tip:"Доверяйте себе — хорошее решение сейчас лучше идеального завтра.",
     sec:"Глубина анализа, внимание к деталям и стремление к качеству."}
};

var cnames={R:"Красный",Y:"Жёлтый",G:"Зелёный",B:"Синий"};
var ans={},cur=0,uname="",nextEnabled=false;

function g(id){return document.getElementById(id);}

function show(id){
  document.querySelectorAll(".screen").forEach(function(s){s.classList.remove("active");});
  g(id).classList.add("active");
  window.scrollTo(0,0);
}

function setNextEnabled(v){
  nextEnabled=v;
  var btn=g("btn-next");
  if(v){btn.removeAttribute("disabled");btn.style.opacity="";}
  else{btn.setAttribute("disabled","");btn.style.opacity="0.3";}
}

function renderQ(){
  var q=qs[cur];
  var pct=Math.round(cur/qs.length*100);
  g("q-num").textContent="Вопрос "+(cur+1)+" из "+qs.length;
  g("q-pct").textContent=pct+"%";
  g("prog").style.width=pct+"%";
  var sel=ans[cur];
  var html="";
  ["a","b"].forEach(function(k,i){
    var s=sel===k;
    html+='<div class="opt'+(s?" sel":"")+'" data-k="'+k+'">'
      +'<div class="opt-l">'+(i===0?"А":"Б")+'</div>'
      +'<span>'+q[k].t+'</span></div>';
  });
  g("opts").innerHTML=html;
  document.querySelectorAll(".opt").forEach(function(el){
    el.addEventListener("pointerdown",function(e){
      e.preventDefault();
      selectOpt(this.getAttribute("data-k"));
    });
  });
  var backBtn=g("btn-back");
  if(cur===0){backBtn.setAttribute("disabled","");backBtn.style.opacity="0.3";}
  else{backBtn.removeAttribute("disabled");backBtn.style.opacity="";}
  setNextEnabled(cur in ans);
  g("btn-next").textContent=cur===qs.length-1?"Смотреть результат ✓":"Далее →";
}

function selectOpt(k){
  ans[cur]=k;
  document.querySelectorAll(".opt").forEach(function(el){
    var s=el.getAttribute("data-k")===k;
    el.classList.toggle("sel",s);
    var l=el.querySelector(".opt-l");
    l.style.background=s?"#1A1A1A":"";
    l.style.color=s?"#fff":"";
  });
  setNextEnabled(true);
}

function goNext(){
  if(!(cur in ans))return;
  if(cur===qs.length-1){showResult();return;}
  cur++;renderQ();
}
function goBack(){if(cur>0){cur--;renderQ();}}

function calcScores(){
  var s={R:0,Y:0,G:0,B:0};
  qs.forEach(function(q,i){if(i in ans)s[q[ans[i]].c]++;});
  return s;
}

function showResult(){
  var s=calcScores();
  var total=Object.values(s).reduce(function(a,b){return a+b;},0)||1;
  var sorted=Object.entries(s).sort(function(a,b){return b[1]-a[1];});
  var topK=sorted[0][0],c=clrs[topK],pcts={};
  sorted.forEach(function(e){pcts[e[0]]=Math.round(e[1]/total*100);});
  var gr=uname?"<strong>"+uname+"</strong>, ваша":"Ваша";
  var html='<div style="margin-bottom:6px"><span class="badge" style="background:'+c.light+';color:'+c.dark+'">'+c.em+" "+c.name+'</span></div>'
    +'<div class="res-name">'+gr+' ведущая энергия</div>'
    +'<p class="res-desc">'+c.desc+'</p><div class="bars">';
  sorted.forEach(function(e){
    var k=e[0],p=pcts[k];
    html+='<div class="bar-row"><div class="bar-name">'+clrs[k].em+" "+cnames[k]+'</div>'
      +'<div class="bar-track"><div class="bar-fill" id="bf-'+k+'" style="background:'+clrs[k].hex+'"></div></div>'
      +'<div class="bar-pct">'+p+'%</div></div>';
  });
  html+='</div><div class="igrid">'
    +'<div class="ibox"><div class="ibox-lbl">Сильные стороны</div><div class="tags">';
  c.str.forEach(function(t){html+='<span class="tag" style="background:'+c.light+';color:'+c.dark+'">'+t+'</span>';});
  html+='</div></div><div class="ibox"><div class="ibox-lbl">Зона роста</div><p>'+c.ch+'</p></div></div>'
    +'<div class="ibox"><div class="ibox-lbl">Совет</div><p>'+c.tip+'</p></div>';
  if(sorted[1][1]>0){
    var sec=clrs[sorted[1][0]];
    html+='<div class="divider"></div><div class="sec-title">Вторичная энергия — '+sec.name+'</div><p class="sec-desc">'+sec.sec+'</p>';
  }
  g("res").innerHTML=html;
  show("s-result");
  setTimeout(function(){
    sorted.forEach(function(e){var el=g("bf-"+e[0]);if(el)el.style.width=pcts[e[0]]+"%";});
  },100);
}

function resetTest(){ans={};cur=0;show("s-intro");}

// All event listeners — no inline onclick
g("btn-start").addEventListener("pointerdown",function(e){
  e.preventDefault();
  uname=g("uname").value.trim();
  show("s-test");
  renderQ();
});
g("btn-next").addEventListener("pointerdown",function(e){
  e.preventDefault();
  goNext();
});
g("btn-back").addEventListener("pointerdown",function(e){
  e.preventDefault();
  goBack();
});
g("btn-reset").addEventListener("pointerdown",function(e){
  e.preventDefault();
  resetTest();
});
</script>
</body>
</html>
